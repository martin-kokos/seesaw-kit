[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "seesaw"
dynamic = ["version"]
description = "ArchiveTeam seesaw kit"
readme = "README.md"
license = "WTFPL"
license-files = [ "LICENSE.txt" ]
keywords = ["WARC", "web", "crawler"]
dependencies = [
  "Tornado>=4,<4.99999.99999",
  "sockjs-tornado",
]
maintainers = [
  {name = "ArchiveTeam", email = "warrior@archiveteam.org"}
]

[project.urls]
Homepage = "https://www.archiveteam.org/"

[project.scripts]
run-pipeline3 = "seesaw.script.run_pipeline:main"
run-warrior3 = "seesaw.script.run_warrior:main"
